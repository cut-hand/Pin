name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app and verify signature
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            scripts/build-release.sh "$GITHUB_REF_NAME"
          else
            scripts/build-release.sh v0.1.4-no-badge.1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pin-no-badge-macos-universal
          path: |
            build/releases/**/*.zip
            build/releases/**/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Pin $GITHUB_REF_NAME — 无钉子版" \
            --notes-file docs/release-notes/no-badge.md \
            build/releases/"$GITHUB_REF_NAME"/*.zip \
            build/releases/"$GITHUB_REF_NAME"/*.sha256
