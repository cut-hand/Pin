name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Swift 6 tests
        run: swift test --arch arm64 -Xswiftc -warnings-as-errors

      - name: Build Apple Silicon app
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            scripts/build-release.sh "$GITHUB_REF_NAME"
          else
            scripts/build-release.sh v0.1.6
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Pin-macos-arm64
          path: |
            build/releases/**/*.zip
            build/releases/**/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Pin $GITHUB_REF_NAME" \
              --notes-file docs/release-notes/v0.1.6.md \
              build/releases/"$GITHUB_REF_NAME"/*.zip \
              build/releases/"$GITHUB_REF_NAME"/*.sha256
          fi
